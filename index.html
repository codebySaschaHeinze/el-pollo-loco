<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="icon" type="image/png" href="./assets/icons/pepe.png" />

    <script defer src="./classes/drawable-objects.class.js"></script>
    <script defer src="./classes/movable-objects.class.js"></script>

    <script defer src="./classes/status-bar.class.js"></script>
    <script defer src="./classes/bottle-bar.class.js"></script>
    <script defer src="./classes/coin-hud.class.js"></script>
    <script defer src="./classes/boss-health-bar.class.js"></script>

    <script defer src="./classes/background-objects.class.js"></script>
    <script defer src="./classes/cloud.class.js"></script>
    <script defer src="./classes/birds.class.js"></script>

    <script defer src="./classes/warning-sign.class.js"></script>
    <script defer src="./classes/adventure-sign.class.js"></script>
    <script defer src="./classes/keep-going-sign.class.js"></script>
    <script defer src="./classes/wheel1.class.js"></script>
    <script defer src="./classes/wheel2.class.js"></script>
    <script defer src="./classes/wheelbarrow.class.js"></script>
    <script defer src="./classes/barrel.class.js"></script>
    <script defer src="./classes/lantern-small.class.js"></script>
    <script defer src="./classes/lantern-big.class.js"></script>
    <script defer src="./classes/lantern-big-foreground.class.js"></script>
    <script defer src="./classes/guitar.class.js"></script>
    <script defer src="./classes/skull.class.js"></script>
    <script defer src="./classes/big-sign-legend.class.js"></script>
    <script defer src="./classes/saloon.class.js"></script>

    <script defer src="./classes/character.class.js"></script>
    <script defer src="./classes/chicken.class.js"></script>
    <script defer src="./classes/chick.class.js"></script>
    <script defer src="./classes/endboss.class.js"></script>

    <script defer src="./classes/bottles.class.js"></script>
    <script defer src="./classes/coins.class.js"></script>
    <script defer src="./classes/throwable-objects.class.js"></script>

    <script defer src="./classes/level.class.js"></script>
    <script defer src="./levels/level1.js"></script>

    <script defer src="./classes/world.class.js"></script>
    <script defer src="./classes/gamekeyboard.class.js"></script>
    <script defer src="./script.js"></script>
  </head>
  <body onload="init()">
    <main>
      <div class="canvas_container">
        <canvas id="canvas" width="720" height="480"></canvas>
        <button id="btn-settings-fab" class="settings-fab" aria-label="Settings">
          <img src="assets/buttons/settings.png" alt="Settings" />
        </button>
        <section id="overlay-1" class="overlay_1">
          <div class="overlay-inner">
            <div class="menu-buttons">
              <img id="btn-start" class="menu-btn" src="assets/buttons/start.png" alt="Start" />
            </div>
            <div class="controls-row">
              <div class="volume-block">
                <span>Volume</span>
                <button id="btn-mute" class="mute-btn" aria-label="Mute/Unmute">
                  <img id="icon-mute" src="assets/buttons/mute-off.png" alt="Mute" />
                </button>
                <input id="volume-slider" type="range" min="0" max="100" step="1" />
                <span id="volume-value">100%</span>
              </div>
              <nav class="legal-links" aria-label="Rechtliches">
                <a href="./impressum.html">Impressum</a>
                <a href="./datenschutz.html">Datenschutz</a>
              </nav>
            </div>
          </div>
        </section>
        <section id="overlay-settings" class="overlay_settings hidden">
          <div class="settings-inner">
            <h2>Einstellungen</h2>
            <div id="back-row" class="settings-row1 hidden">
              <button id="btn-back-start" class="settings-action">Zurück zum Start</button>
            </div>

            <div class="settings-row">
              <button id="btn-close-settings" class="settings-action">Zurück zum Spiel</button>
            </div>
          </div>
        </section>
        <section id="overlay-legal" class="overlay_settings hidden" aria-modal="true" role="dialog">
          <div class="settings-inner legal-inner">
            <h2 id="legal-title">Rechtliches</h2>
            <div id="legal-body" class="legal-body">Lädt…</div>
            <div class="settings-row">
              <button id="btn-legal-close" class="settings-action">Zurück</button>
            </div>
          </div>
        </section>
        <section id="overlay-result" class="overlay_result hidden">
          <div class="result-inner">
            <img id="result-img" alt="Result" />
            <div class="result-actions">
              <button id="btn-result-restart" class="settings-action">Level neu starten</button>
              <button id="btn-result-start" class="settings-action">Zurück zum Start</button>
            </div>
          </div>
        </section>

        <section id="overlay-rotate" class="overlay_rotate hidden" aria-hidden="true">
          <div class="rotate-inner"></div>
        </section>

        <div id="overlay-buttons" class="hidden">
          <div class="buttons-left">
            <button id="button-left"><img src="assets/buttons/left.png" alt="Move right button" /></button>
            <button id="button-right"><img src="assets/buttons/right.png" alt="Move left button" /></button>
          </div>
          <div class="buttons-right">
            <button id="button-jump"><img src="assets/buttons/jump.png" alt="Jump button" /></button>
            <button id="button-throw"><img src="assets/buttons/throw.png" alt="Throw bottles button" /></button>
          </div>
        </div>
      </div>

      <section class="rotate-overlay" aria-hidden="true">Bitte Gerät drehen</section>
    </main>
     
  </body>
</html>
